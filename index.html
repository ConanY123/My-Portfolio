<!DOCTYPE html>
<html lang="en" data-theme="dark">


<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" /> <!--makes it work on mobile-->
<meta name="color-scheme" content="dark" />
<title>Portfolio</title>
<meta name="description" content="conan yu computer engineering portfolio" />
<link rel="icon" href="./assets/images/c.png" type="image/png" />
<link rel="stylesheet" href="./css/styles.css" />
</head>


<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div id="bg-veil" aria-hidden="true"></div>


  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#/" aria-label="Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" data-bind="brand-name"></span>
        <span class="brand-tag" data-bind="brand-tag"></span>
      </a>

      <nav class="nav" id="primary-nav" aria-label="Primary">
        <ul class="nav-list" id="nav-list"></ul>
      </nav>

      <div class="header-tools">
        <button class="icon-btn nav-burger" id="nav-toggle" type="button" aria-expanded="false">
          <span>MENU</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="site-main shell"></main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p class="footer-note" data-bind="footer-note"></p>
      <p class="footer-meta">
        <span data-bind="footer-links"></span>
      </p>
    </div>
  </footer>

  <div class="bg-switch bg-switcher" id="bg-switch" data-persist="1" aria-label="Background animation style">
    <div class="bg-switch-row">
      <span class="bg-switch-label" aria-hidden="true">BG</span>
      <div class="bg-switch-options" id="bg-switch-options"></div>
    </div>
    <div class="bg-sliders" id="bg-sliders" hidden></div>
  </div>

  <noscript>
    <div class="shell noscript">
      This portfolio renders its content from a single JavaScript data file, so
      it needs JavaScript enabled.
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
